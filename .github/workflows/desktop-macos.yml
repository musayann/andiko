name: Desktop macOS build

on:
  push:
    branches: [main]
  workflow_dispatch:

# every push to main is a release, so builds queue instead of cancelling one mid-publish
concurrency:
  group: desktop-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # a failing lint, format, typecheck or test run blocks the build
  build:
    needs: ci
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # version from package.json "packageManager"
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - run: pnpm install --frozen-lockfile

      # major.minor from apps/desktop/package.json, then the run number, so each release is newer
      - name: Set version
        run: echo "VERSION=$(jq -r .version apps/desktop/package.json | cut -d. -f1,2).${{ github.run_number }}" >> "$GITHUB_ENV"

      # beforeBuildCommand runs the Next.js static export first. The updater archive
      # (Andiko.app.tar.gz and its .sig) is only made here, where the signing key is
      - name: Build universal .app and .dmg
        run: >-
          pnpm --filter @andiko/desktop tauri build --target universal-apple-darwin --bundles app,dmg
          --config "{\"version\":\"$VERSION\",\"bundle\":{\"createUpdaterArtifacts\":true}}"
        env:
          # ad-hoc signature: no Apple account needed, Gatekeeper asks once (Open Anyway)
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NEXT_TELEMETRY_DISABLED: "1"
          # where the Report link on shared documents writes to, as on the website; unset leaves it out
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}

      # installed apps read latest.json from the latest release (plugins.updater in tauri.conf.json);
      # the universal archive serves both architectures
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bundle=apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle
          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg url "https://github.com/${{ github.repository }}/releases/download/v$VERSION/Andiko.app.tar.gz" \
            --arg signature "$(cat "$bundle/macos/Andiko.app.tar.gz.sig")" \
            '{version: $version, pub_date: $pub_date, platforms: {
              "darwin-aarch64": {url: $url, signature: $signature},
              "darwin-x86_64": {url: $url, signature: $signature}
            }}' > latest.json
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Andiko $VERSION" --generate-notes --latest \
            "$bundle"/dmg/*.dmg "$bundle/macos/Andiko.app.tar.gz" "$bundle/macos/Andiko.app.tar.gz.sig" latest.json

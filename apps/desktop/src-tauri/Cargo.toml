[package]
name = "andiko-desktop"
version = "0.1.0"
description = "Andiko, the Markdown editor, as a Mac app"
edition = "2021"

[lib]
name = "andiko_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }

# spell-checking (src/spelling.rs); already in the build through Tauri's webview
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSArray",
  "NSDictionary",
  "NSObject",
  "NSOrthography",
  "NSRange",
  "NSString",
  "NSTextCheckingResult",
  "NSUserDefaults",
  "NSValue",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSSpellChecker"] }
